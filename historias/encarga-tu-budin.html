<!doctype html>

<style>
:root{--crema:#fff8ee;--display:"Bricolage Grotesque","DM Sans",sans-serif;--texto:"DM Sans",sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;font-family:var(--texto)}
.h{position:relative;width:1080px;height:1920px;background:url(limon-plato.jpg) 50% 60%/cover;color:var(--crema);overflow:hidden}

.bot{bottom:300px}
.cta{font-size:42px;font-weight:500}

.wa svg{width:78px;height:78px;flex:none}
