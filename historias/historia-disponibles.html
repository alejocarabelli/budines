<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<style>
:root{--mandarina:#e8673c;--cacao:#2b1d16;--crema:#faf3e8;--display:"Bricolage Grotesque","DM Sans",sans-serif;--texto:"DM Sans",sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;font-family:var(--texto)}
.h-prod{position:relative;overflow:hidden;width:1080px;height:1920px;padding:300px 96px 330px;display:flex;flex-direction:column;color:var(--crema);
  background:url(../fotos/limon-cortado-01.jpg) 62% 50%/cover}
.h-prod::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(43,29,22,.72) 0%,rgba(43,29,22,.3) 25%,rgba(43,29,22,0) 38%,rgba(43,29,22,0) 50%,rgba(43,29,22,.88) 76%)}
.h-prod>*{position:relative}
.marca{font-family:var(--display);font-weight:800;letter-spacing:-.04em;line-height:1;font-size:48px}
.fecha{display:inline-block;align-self:flex-start;margin-top:40px;background:var(--mandarina);color:var(--crema);font-family:var(--display);font-weight:700;font-size:38px;padding:12px 30px;border-radius:999px}
h1{margin-top:24px;font-family:var(--display);font-weight:800;font-size:112px;letter-spacing:-.045em;line-height:.9}
.abajo{margin-top:auto}
ul{list-style:none;border-bottom:3px solid rgba(250,243,232,.45);margin-bottom:40px}
li{display:flex;justify-content:space-between;align-items:baseline;padding:20px 0;border-top:3px solid rgba(250,243,232,.45);font-family:var(--display);font-weight:700;font-size:58px;letter-spacing:-.03em;line-height:1}
li span{font-family:var(--texto);font-weight:500;font-size:36px;letter-spacing:0;opacity:.92}
li span b{font-family:var(--display);font-weight:800;font-size:58px;letter-spacing:-.03em;margin-right:12px;opacity:1}
p{font-size:40px;font-weight:500}
.tel{display:flex;align-items:center;gap:22px;font-family:var(--display);font-weight:800;font-size:92px;letter-spacing:-.03em;line-height:1;margin-top:12px}
.tel svg{width:84px;height:84px;flex:none}
</style></head><body>
<div class="h-prod">
  <div class="marca">miguitas</div>
  <span class="fecha">Disponibles hoy</span>
  <h1>Hay budines<br>listos.</h1>
  <div class="abajo">
    <ul>
      <li>Limón<span><b>5</b>disponibles</span></li>
      <li>Chocolate<span><b>2</b>disponibles</span></li>
      <li>Naranja<span><b>2</b>disponibles</span></li>
      <li>Chips<span><b>3</b>disponibles</span></li>
    </ul>
    <p>Reservá el tuyo por WhatsApp</p>
    <div class="tel"><svg viewBox="0 0 32 32"><path fill="currentColor" d="M16 3a13 13 0 0 0-11.2 19.6L3 29l6.6-1.7A13 13 0 1 0 16 3zm0 23.6a10.6 10.6 0 0 1-5.4-1.5l-.4-.2-3.9 1 1-3.8-.2-.4A10.6 10.6 0 1 1 16 26.6zm5.8-7.9c-.3-.2-1.9-.9-2.2-1s-.5-.2-.7.2-.8 1-1 1.2-.4.2-.7.1a8.7 8.7 0 0 1-4.3-3.8c-.3-.6.3-.5.9-1.7.1-.2 0-.4 0-.5l-1-2.4c-.3-.6-.5-.5-.7-.5h-.6a1.2 1.2 0 0 0-.9.4 3.6 3.6 0 0 0-1.1 2.7 6.3 6.3 0 0 0 1.3 3.3 14.4 14.4 0 0 0 5.5 4.9c2 .9 2.8 1 3.9.8a3.3 3.3 0 0 0 2.1-1.5 2.7 2.7 0 0 0 .2-1.5c-.1-.1-.3-.2-.6-.3z"/></svg>2634 36-9364</div>
  </div>
</div>
</body></html>
