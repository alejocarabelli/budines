<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700;1,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px}
body{background:#FBF3E3;font-family:'DM Sans',sans-serif;color:#3B2A1A;display:flex;flex-direction:column;align-items:center;overflow:hidden}
.top{height:330px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.kicker{font-size:34px;letter-spacing:10px;text-transform:uppercase;color:#B5813A;font-weight:700}
h1{font-family:'Playfair Display',serif;font-style:italic;font-weight:800;font-size:150px;line-height:1;color:#3B2A1A}
.photo{width:1080px;height:1060px;background:url('../fotos/limon-cortado-01.jpg') center 62%/cover no-repeat}
.list{flex:1;width:100%;padding:60px 70px 0;display:grid;grid-template-columns:1fr 1fr;gap:22px 28px;align-content:start}
.item{background:#fff;border-radius:28px;padding:22px 30px;display:flex;align-items:center;gap:22px;box-shadow:0 4px 0 #EBDcc2}
.n{font-family:'Playfair Display',serif;font-weight:700;font-size:72px;line-height:1;color:#D9971E;min-width:52px;text-align:center}
.s{font-size:46px;font-weight:700;line-height:1.05}
.s small{display:block;font-size:24px;font-weight:500;color:#9A8266;letter-spacing:1px;margin-top:4px}
.foot{height:150px;display:flex;align-items:center;justify-content:center}
.cta{background:#3B2A1A;color:#FBF3E3;font-size:38px;font-weight:700;padding:24px 56px;border-radius:999px;letter-spacing:.5px}
</style></head><body>
<div class="top"><div class="kicker">Recién horneados</div><h1>¡Hay budines!</h1></div>
<div class="photo"></div>
<div class="list">
  <div class="item"><span class="n">5</span><span class="s">Limón</span></div>
  <div class="item"><span class="n">3</span><span class="s">Chips de<br>chocolate</span></div>
  <div class="item"><span class="n">2</span><span class="s">Naranja</span></div>
  <div class="item"><span class="n">2</span><span class="s">Chocolate</span></div>
</div>
<div class="foot"><div class="cta">Escribime y reservá el tuyo 💛</div></div>
</body></html>
