<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<style>
:root{--mandarina:#e8673c;--cacao:#2b1d16;--crema:#faf3e8;--display:"Bricolage Grotesque","DM Sans",sans-serif;--texto:"DM Sans",sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;font-family:var(--texto)}
.h{width:1080px;height:1920px;background:var(--cacao);color:var(--crema);display:flex;flex-direction:column}
.foto{width:1080px;height:1440px;background:url(../fotos/limon-cortado-01.jpg) center/cover;flex:none}
.texto{padding:56px 96px 0}
.fila{display:flex;align-items:center;justify-content:space-between}
.marca{font-family:var(--display);font-weight:800;letter-spacing:-.04em;line-height:1;font-size:44px}
.fecha{background:var(--mandarina);font-family:var(--display);font-weight:700;font-size:34px;padding:10px 26px;border-radius:999px}
h1{margin-top:26px;font-family:var(--display);font-weight:800;font-size:104px;letter-spacing:-.045em;line-height:.9}
.sabores{display:flex;flex-wrap:wrap;gap:14px;margin-top:30px}
.sabores span{font-size:32px;font-weight:600;padding:8px 22px;border-radius:999px;border:3px solid rgba(250,243,232,.6)}
</style></head><body>
<div class="h">
  <div class="foto"></div>
  <div class="texto">
    <div class="fila"><span class="fecha">Disponibles hoy</span><span class="marca">miguitas</span></div>
    <h1>Hay budines.</h1>
    <div class="sabores"><span>Limón</span><span>Chocolate</span><span>Naranja</span><span>Chips</span></div>
  </div>
</div>
</body></html>
